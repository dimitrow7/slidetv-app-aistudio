name: Build Test APK (artifact)

# Builds a signed release APK and uploads it as a workflow artifact for
# sideloading / adb testing. Does NOT create a GitHub release or notify the
# backend (unlike release.yml). Signed with the same upload key, so it can be
# installed over an existing install with `adb install -r`.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.2-test)"
        required: true
        default: "1.0.2-test"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/keystore.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: gradle assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: slidetv-test-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
